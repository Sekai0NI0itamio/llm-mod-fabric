plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = uri("$rootDir/localmaven") }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (resolved from local maven repo populated in CI).
    modImplementation "net.fabricmc:fabric-api:${project.fabric_version}"

    // Inference engine: java-llama.cpp (bundles native libs for Linux x86-64 CPU)
    // Native compilation flags (if rebuilding from source): -DLLAMA_CURL=ON -DLLAMA_BUILD_TESTS=OFF
    modImplementation "de.kherud:llama:${project.llama_version}"
    include "de.kherud:llama:${project.llama_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}