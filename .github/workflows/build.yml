name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Fabric API jar
        run: |
          mkdir -p libs
          FV="0.92.2+1.20.1"
          curl -sL -o "libs/fabric-api-${FV}.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${FV}/fabric-api-${FV}.jar"
          ls -la libs/

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llm-mod
          path: build/libs/*.jar

  build-native-llama:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout java-llama.cpp
        uses: actions/checkout@v4
        with:
          repository: kherud/java-llama.cpp
          path: java-llama.cpp
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libcurl4-openssl-dev
      - name: Configure CMake (CURL enabled)
        working-directory: java-llama.cpp
        run: |
          mvn -q -o compile 2>/dev/null || true
          cmake -S . -B build -DLLAMA_CURL=ON -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build native libs
        working-directory: java-llama.cpp
        run: cmake --build build --config Release -j 2
      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: jllama-native-linux-x86_64
          path: |
            java-llama.cpp/build/**/*.so
